name: Book CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: book-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  book-tests:
    name: Tests de books
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Correr tests de books
        run: npx vitest run tests/books.test.ts
